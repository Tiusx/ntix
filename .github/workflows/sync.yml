# 前置准备（一次性）：
# 1. 将本仓库推送到 GitHub，默认分支为 main
# 2. Cloudflare Pages 连接本仓库：构建命令 pnpm build，输出目录 out，
#    Node 版本 24（也可在项目内放 .nvmrc），安装命令 pnpm install
#    （构建时会自动执行 prebuild 同步 memos）
# 3. 可选：在 repository variables 添加 MEMOS_API 覆盖 memos API 地址（默认用 memos.tius.cn）

name: Sync Memos, Posts and Pages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 图片管道为全串行（每图含下载 + sharp + R2 往返 + 100ms 延迟），
    # 图片较多的文章会显著拉长耗时，10 分钟不够用。
    timeout-minutes: 20
    # secrets 不能直接在 step 的 if 条件中读取；先提为 job 级 env，
    # step 的 if 走 env.NOTION_API_SECRET 判断是否配置
    env:
      NOTION_API_SECRET: ${{ secrets.NOTION_API_SECRET }}
      NOTION_POSTS_DATABASE_ID: ${{ secrets.NOTION_POSTS_DATABASE_ID }}
      NOTION_PAGES_DATABASE_ID: ${{ secrets.NOTION_PAGES_DATABASE_ID }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect sync mode
        id: detect
        run: |
          hour=$(date -u +%H)
          # 手动触发（workflow_dispatch）一律跑全量清理；
          # 定时任务仅在 北京时间 00:00 (UTC 16:00) 和 12:00 (UTC 04:00) 跑全量
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "16" ] || [ "$hour" = "04" ]; then
            echo "full_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync memos, posts & pages from Notion (sync:all)
        if: env.NOTION_API_SECRET != '' && (env.NOTION_POSTS_DATABASE_ID != '' || env.NOTION_PAGES_DATABASE_ID != '')
        env:
          NOTION_POSTS_DATABASE_ID: ${{ secrets.NOTION_POSTS_DATABASE_ID }}
          NOTION_PAGES_DATABASE_ID: ${{ secrets.NOTION_PAGES_DATABASE_ID }}
          MEMOS_API: ${{ vars.MEMOS_API || 'https://memos.tius.cn/api/v1/memos' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'cf-imgbed' }}
          R2_PUBLIC_DOMAIN: ${{ vars.R2_PUBLIC_DOMAIN || 'https://r2.tius.cn' }}
        run: |
          # memos 由 sync:all 内部第一步同步（始终全量镜像），
          # 此处不再单独跑一次，避免每小时的 API 负载与磁盘写入翻倍。
          if [ "${{ steps.detect.outputs.full_sync }}" = "true" ]; then
            echo "🔄 Scheduled full-sync (daily cleanup)"
            pnpm sync:all:full:strict
          else
            pnpm sync:all:strict
          fi

      - name: Commit and push generated content
        run: |
          git checkout -B main
          git config user.name "Tiusx"
          git config user.email "34855328+Tiusx@users.noreply.github.com"
          git add content .fetch-state.json

          if git diff --cached --quiet; then
            echo "No content changes; skip commit."
            exit 0
          fi

          # 阶段 0 已在脚本内加了空集合熔断与 50% 比例阈值；
          # 这里是最后一道防线：若本次提交会让 content 的 markdown **净减少**过多，直接拒绝提交。
          #
          # 只看 deleted 会误伤：Memos 实例重建后所有 uid 重新生成，一次同步表现为
          # 「删 8 个旧文件 + 写 8 个新文件」，内容一字未变，但 deleted 计数照算。
          # 而且 git 会把内容相同的改名识别为 rename，连 8 都数不全（曾数出 6/28）。
          # 所以改比 HEAD 与暂存区的文件总数差值——增删相抵，只拦真正的缩水。
          before=$(git ls-tree -r HEAD --name-only -- content/ | grep -c '\.md$' || true)
          after=$(git ls-files -- content/ | grep -c '\.md$' || true)
          net=$(( before - after ))
          echo "content markdown: HEAD ${before} → staged ${after}（净减少 ${net}）"
          if [ "${net}" -gt 0 ] && [ "${before}" -gt 0 ]; then
            ratio=$(( net * 100 / before ))
            if [ "${ratio}" -ge 15 ]; then
              echo "::error::Refusing to commit: content markdown would shrink by ${ratio}% (${before} → ${after}, net -${net})."
              echo "::error::Investigate before retrying — this usually means a misconfigured Notion / Memos query."
              exit 1
            fi
          fi

          git commit -m "chore(content): sync memos, posts and pages"
          git push origin main

      # IndexNow 提交依赖上一次的结果来判断「哪些 URL 变了」，
      # 而 runner 每次都是全新的，因此用 cache 跨运行保留指纹文件。
      - name: Restore IndexNow state
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: |
            indexnow-state-

      - name: Submit IndexNow URLs (Bing/Google 主动收录)
        if: always() && env.INDEXNOW_KEY != ''
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://tius.cn' }}
        run: pnpm submit:indexnow

      - name: Warn when IndexNow is not configured
        # 缺 key 时 GitHub 只会把 secret 求值为空串，步骤被静默跳过、job 仍显示绿色。
        # 这里显式告警，避免「以为在提交、其实从没提交过」。
        if: always() && env.INDEXNOW_KEY == ''
        run: |
          echo "::warning title=IndexNow 未启用::缺少 INDEXNOW_KEY secret，本次未提交任何 URL。请在仓库 Settings → Secrets and variables → Actions 中添加 INDEXNOW_KEY（内容需与 public/indexnow-key-<KEY>.txt 一致）。"
          echo "可用 pnpm submit:indexnow:list 本地预览将要提交的 URL。"
          pnpm submit:indexnow:list || true

      - name: Save IndexNow state
        if: always() && env.INDEXNOW_KEY != ''
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}