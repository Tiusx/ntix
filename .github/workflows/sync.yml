# 前置准备（一次性）：
# 1. 将本仓库推送到 GitHub，默认分支为 main
# 2. Cloudflare Pages 连接本仓库：构建命令 pnpm build，输出目录 out，
#    Node 版本 24（也可在项目内放 .nvmrc），安装命令 pnpm install
#    （构建时会自动执行 prebuild 同步 memos）
# 3. 可选：在 repository variables 添加 MEMOS_API 覆盖 memos API 地址（默认用 memos.tius.cn）

name: Sync Memos and Posts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # secrets 不能直接在 step 的 if 条件中读取；先提为 job 级 env，
    # step 的 if 走 env.NOTION_API_SECRET 判断是否配置
    env:
      NOTION_API_SECRET: ${{ secrets.NOTION_API_SECRET }}
      NOTION_PAGES_DATABASE_ID: ${{ secrets.NOTION_PAGES_DATABASE_ID }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect sync mode
        id: detect
        run: |
          hour=$(date -u +%H)
          # 手动触发（workflow_dispatch）一律跑全量清理；
          # 定时任务仅在 北京时间 00:00 (UTC 16:00) 和 12:00 (UTC 04:00) 跑全量
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "16" ] || [ "$hour" = "04" ]; then
            echo "full_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync memos
        env:
          MEMOS_API: ${{ vars.MEMOS_API || 'https://memos.tius.cn/api/v1/memos' }}
        run: pnpm sync:memos:strict

      - name: Sync posts from Notion
        if: env.NOTION_API_SECRET != ''
        env:
          NOTION_POSTS_DATABASE_ID: ${{ secrets.NOTION_POSTS_DATABASE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'cf-imgbed' }}
          R2_PUBLIC_DOMAIN: ${{ vars.R2_PUBLIC_DOMAIN || 'https://r2.tius.cn' }}
        run: |
          if [ "${{ steps.detect.outputs.full_sync }}" = "true" ]; then
            echo "🔄 Scheduled full-sync (daily cleanup)"
            pnpm sync:posts:full:strict
          else
            pnpm sync:posts:strict
          fi

      - name: Sync pages from Notion
        if: env.NOTION_API_SECRET != '' && env.NOTION_PAGES_DATABASE_ID != ''
        run: |
          if [ "${{ steps.detect.outputs.full_sync }}" = "true" ]; then
            echo "🔄 Scheduled full-sync (pages cleanup)"
            pnpm sync:pages:full:strict
          else
            pnpm sync:pages:strict
          fi

      - name: Commit and push generated content
        run: |
          git checkout -B main
          git config user.name "Tiusx"
          git config user.email "34855328+Tiusx@users.noreply.github.com"
          git add content .fetch-state.json
          if git diff --cached --quiet; then
            echo "No content changes; skip commit."
          else
            git commit -m "chore(content): sync memos and posts"
            git push origin main
          fi

      - name: Submit IndexNow URLs (Bing/Google priority indexing)
        if: env.INDEXNOW_KEY != ''
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://tius.cn' }}
        run: pnpm submit:indexnow